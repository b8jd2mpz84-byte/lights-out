<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lights Out</title>
  <meta name="description" content="Formula start, stripped to the reflex. Darkness is the signal.">
  <meta name="theme-color" content="#07080c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lights Out">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preload" href="fonts/Rajdhani-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Rajdhani"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/Rajdhani-500.woff2") format("woff2"); }
    @font-face { font-family: "Rajdhani"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/Rajdhani-600.woff2") format("woff2"); }
    @font-face { font-family: "Rajdhani"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/Rajdhani-700.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500 700; font-style: normal; font-display: swap; src: url("fonts/JetBrainsMono-var.woff2") format("woff2"); }

    :root {
      --font-sans: "Rajdhani", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --color-canvas: #07080c;
      --color-panel: #161a24;
      --color-inset: #0d1017;
      --color-ink: #e8ebf3;
      --color-muted: #8e94a8;
      --color-line: #2a3042;
      --color-metal: #1a1f2b;
      --color-bezel: #343b4e;
      --color-signal: #ff2d2d;
      --color-red-dim: #3a1418;
      --color-go: #2fe88a;
      --color-fault: #ffb020;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--color-canvas); }
    html.is-playing, html.is-playing body { touch-action: none; overflow: hidden; }
    html.is-playing [data-control] { pointer-events: none; }
    html.is-playing .tools, html.is-playing .mode-btn { opacity: 0.45; }
    .tools, .mode-btn { transition: opacity 120ms ease-out; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 42% at 50% -12%, color-mix(in srgb, var(--color-signal) 16%, transparent), transparent 62%),
        var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-weight: 600;
      line-height: 1.45;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button { font: inherit; color: inherit; }
    button:not(:disabled) { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.4; }
    :focus-visible { outline: 2px solid var(--color-go); outline-offset: 3px; }

    .shell {
      width: min(100%, 32rem);
      margin: 0 auto;
      display: flex;
      min-height: 100dvh;
      flex-direction: column;
      justify-content: safe center;
      gap: 0.85rem;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .foot, .kicker, .banner, .via, .stat-label, .board-label, .cell-label, .card-head, .card-sub, .card-foot, .about, .file-note {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--color-muted);
    }
    .wordmark { margin: 0; font-size: 1.6rem; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
    .tools { display: flex; align-items: center; gap: 0.5rem; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border-radius: 0.75rem;
      border: 1px solid var(--color-line);
      background: var(--color-inset);
      color: var(--color-muted);
    }
    .icon-btn[aria-pressed="true"] { color: var(--color-ink); }
    .icon-btn svg { width: 1.25rem; height: 1.25rem; }

    .mode-btn {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 0.75rem; row-gap: 0.1rem;
      width: 100%; min-height: 3.5rem; padding: 0.55rem 0.9rem; text-align: left;
      border: 1px solid var(--color-line); border-radius: 0.9rem; background: var(--color-inset); color: var(--color-ink);
    }
    .mode-btn:active { background: var(--color-panel); }
    .mode-name { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
    .mode-blurb { grid-column: 1; font-size: 0.85rem; font-weight: 500; line-height: 1.3; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mode-caret { grid-column: 2; grid-row: 1 / span 2; display: grid; place-items: center; color: var(--color-muted); }
    .mode-caret svg { width: 1.25rem; height: 1.25rem; }

    .panel { overflow: hidden; border: 1px solid var(--color-line); border-radius: 1.25rem; background: var(--color-panel); box-shadow: 0 28px 60px -32px black; }
    .play-surface { display: block; width: 100%; cursor: pointer; background: transparent; text-align: center; padding: 1rem 1rem 0.4rem; touch-action: none; }
    .play-surface:active { background: color-mix(in srgb, white 3%, transparent); }
    .play-surface:focus-visible { outline-offset: -6px; }

    .gantry { position: relative; border-radius: 999px; }
    .gantry-bar {
      display: flex; align-items: center; gap: 0.65rem; padding: 0.8rem 0.85rem;
      border: 1px solid var(--color-line); border-radius: 999px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--color-bezel) 72%, white), var(--color-metal) 46%, var(--color-inset));
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 16%, transparent);
    }
    .gantry.is-charged .gantry-bar { box-shadow: inset 0 1px 0 color-mix(in srgb, white 16%, transparent), 0 0 26px color-mix(in srgb, var(--color-signal) 32%, transparent); }
    .pairs { display: flex; flex: 1; justify-content: space-between; gap: 0.4rem; }
    .pair { display: flex; flex-direction: column; align-items: center; gap: 0.38rem; }
    .bulb {
      width: 1.8rem; height: 1.8rem; border-radius: 999px;
      background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--color-signal) 30%, black), var(--color-red-dim) 54%, black 78%);
      box-shadow: inset 0 -5px 7px black, 0 0 0 3px var(--color-bezel), 0 0 0 4px color-mix(in srgb, black 45%, var(--color-line));
    }
    .bulb.is-on {
      background: radial-gradient(circle at 50% 36%, color-mix(in srgb, white 86%, var(--color-signal)), var(--color-signal) 40%, color-mix(in srgb, var(--color-signal) 42%, black));
      box-shadow: inset 0 -5px 7px color-mix(in srgb, black 30%, transparent), 0 0 0 3px var(--color-bezel), 0 0 16px 2px color-mix(in srgb, var(--color-signal) 78%, transparent);
      animation: lamp-in 90ms ease-out;
    }
    .rivet { width: 0.42rem; height: 0.42rem; flex: none; border-radius: 999px; background: radial-gradient(circle at 35% 35%, color-mix(in srgb, white 40%, var(--color-line)), var(--color-inset)); box-shadow: inset 0 1px 1px black; }
    .led { height: 3px; margin: 0.7rem 1.2rem 0; border-radius: 999px; background: var(--color-red-dim); opacity: 0.5; }
    .led.is-hot { background: var(--color-signal); opacity: 1; box-shadow: 0 0 12px var(--color-signal); }
    .led.is-fault { background: var(--color-fault); opacity: 1; box-shadow: 0 0 12px var(--color-fault); }
    .led.is-best { background: var(--color-go); opacity: 1; box-shadow: 0 0 12px var(--color-go); }
    .grid-mark {
      height: 1.85rem; margin: 0.8rem 0.2rem 0.15rem;
      background: linear-gradient(var(--color-ink), var(--color-ink)) center / 100% 2px no-repeat, repeating-linear-gradient(90deg, transparent 0 15px, color-mix(in srgb, var(--color-ink) 75%, transparent) 15px 17px);
      opacity: 0.28;
      -webkit-mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
    }
    .stage-copy { display: flex; min-height: 9.75rem; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; padding: 0.35rem 0.5rem 0.55rem; }
    .kicker { margin: 0; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .status { margin: 0; font-size: 1.65rem; font-weight: 700; line-height: 1.1; }
    .banner { min-height: 1rem; margin: 0.15rem 0 0; color: var(--color-go); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    .readout { display: flex; align-items: baseline; justify-content: center; min-height: 3.6rem; margin: 0; }
    .readout-num { font-family: var(--font-mono); font-size: clamp(2.7rem, 12vw, 3.6rem); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .readout-num.is-word { font-size: clamp(2.1rem, 9vw, 2.7rem); letter-spacing: 0.04em; }
    .readout-unit { margin-left: 0.35rem; color: var(--color-muted); font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; }
    .hint { max-width: 18rem; min-height: 2.4rem; margin: 0.1rem 0 0; color: var(--color-muted); font-size: 0.95rem; font-weight: 600; line-height: 1.35; }
    .via { margin: 0; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .tone-go { color: var(--color-go); }
    .tone-fault { color: var(--color-fault); }
    .tone-wait { color: var(--color-muted); }
    .tone-idle, .tone-ink { color: var(--color-ink); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; padding: 0 1rem 1rem; }
    .stat { border-radius: 0.75rem; border: 1px solid var(--color-line); background: var(--color-inset); padding: 0.625rem 0.5rem; text-align: center; }
    .stat-label { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .stat-value { margin-top: 0.25rem; font-family: var(--font-mono); font-size: 1.125rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .history, .session-wrap { padding: 0 1rem 1rem; }
    .board-label { margin: 0 0 0.5rem; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .bars { display: flex; align-items: flex-end; gap: 0.35rem; height: 4.5rem; }
    .bars.is-empty { align-items: center; justify-content: center; border: 1px dashed var(--color-line); border-radius: 0.5rem; color: var(--color-muted); font-size: 0.875rem; }
    .bar-wrap { display: flex; flex: 1; align-items: flex-end; height: 100%; }
    .bar { width: 100%; min-height: 4px; border-radius: 0.2rem 0.2rem 0 0; background: var(--color-bezel); }
    .bar.is-best { background: var(--color-go); }
    .bar.is-fault { height: 100%; background: var(--color-fault); }
    .session { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.375rem; list-style: none; margin: 0; padding: 0; }
    .cell { border-radius: 0.5rem; border: 1px solid var(--color-line); background: var(--color-inset); padding: 0.5rem 0.25rem; text-align: center; }
    .cell.is-best { border-color: var(--color-go); }
    .cell.is-next, .cell.is-latest { border-color: var(--color-ink); }
    .cell-label { font-size: 0.75rem; }
    .cell-value { margin-top: 0.125rem; font-family: var(--font-mono); font-size: 0.875rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .chip { min-height: 2.75rem; border: 1px solid var(--color-line); border-radius: 0.75rem; background: var(--color-inset); padding: 0.4rem 0.8rem; font-size: 0.92rem; }
    .chip[aria-pressed="false"] { color: var(--color-muted); }
    .chip.is-danger { border-color: var(--color-fault); color: var(--color-fault); }
    .chip.is-primary { display: block; width: 100%; margin-top: 0.85rem; border-color: var(--color-ink); background: var(--color-ink); color: var(--color-canvas); font-weight: 700; }
    .grid-list { display: grid; gap: 0.25rem; margin: 0 0 0.75rem; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .grid-row { display: grid; width: 100%; grid-template-columns: 2.2rem 1fr auto; gap: 0.5rem; align-items: center; padding: 0.35rem 0.65rem; border: 1px solid transparent; border-radius: 0.5rem; background: var(--color-inset); color: var(--color-muted); text-align: left; }
    button.grid-row { min-height: 2.6rem; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    button.grid-row::after { content: "›"; margin-left: 0.25rem; color: var(--color-muted); font-size: 1rem; }
    .grid-row.is-log { grid-template-columns: 2rem minmax(0, 1fr) auto auto auto auto; }
    .grid-row.is-log .grid-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid-row.is-you { border-color: var(--color-ink); color: var(--color-ink); font-weight: 700; }
    .grid-row.is-fault .grid-time { color: var(--color-fault); }
    .grid-row.is-win .grid-pos { color: var(--color-go); }
    .grid-row.has-extra { grid-template-columns: 2.2rem 1fr auto 3.2rem; }
    .grid-extra { text-align: right; color: var(--color-ink); }
    .dot { display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.45rem; border-radius: 999px; vertical-align: 0.05rem; }
    .calendar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.25rem; margin: 0.75rem 0; padding: 0; }
    .cal { min-width: 0; padding: 0.3rem 0; border: 1px solid var(--color-line); border-radius: 0.4rem; background: var(--color-inset); text-align: center; font-family: var(--font-mono); font-size: 0.65rem; color: var(--color-muted); }
    .cal:disabled { opacity: 1; cursor: default; }
    .cal:not(:disabled) { color: var(--color-ink); }
    .cal b { display: block; font-size: 0.8rem; color: var(--color-ink); }
    .cal.is-current { border-color: var(--color-ink); }
    .cal.is-win b { color: var(--color-go); }
    .season-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 0.75rem; margin: 0 0 0.25rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted); }
    .season-meta .actions { display: flex; gap: 0.5rem; }
    .file-note { min-height: 1.2rem; margin: 0.5rem 0 0; font-size: 0.75rem; }
    .about { margin: 0.75rem 0 0; font-size: 0.75rem; line-height: 1.5; }

    /* Bottom sheet: mode picker, settings, season cards */
    .sheet { position: fixed; inset: auto 0 0 0; width: min(100%, 32rem); max-width: none; max-height: 88dvh; margin: 0 auto; padding: 0; border: 1px solid var(--color-line); border-bottom: 0; border-radius: 1.25rem 1.25rem 0 0; background: var(--color-panel); color: var(--color-ink); box-shadow: 0 -24px 60px -24px black; overflow: hidden; }
    .sheet::backdrop { background: rgb(0 0 0 / 0.62); }
    .sheet[open] { display: flex; flex-direction: column; }
    .sheet-grip { flex: none; width: 2.5rem; height: 4px; margin: 0.6rem auto 0; border-radius: 999px; background: var(--color-line); }
    .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 1rem 0.5rem; }
    .sheet-title { margin: 0; font-size: 1.15rem; font-weight: 700; }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 1rem max(1.25rem, env(safe-area-inset-bottom)); }
    .sheet .grid-list { margin-bottom: 0.9rem; }
    .sheet .stats { padding: 0 0 0.9rem; }
    .mode-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 0.75rem; row-gap: 0.15rem; width: 100%; margin: 0 0 0.5rem; padding: 0.75rem 0.9rem; text-align: left; border: 1px solid var(--color-line); border-radius: 0.9rem; background: var(--color-inset); color: var(--color-ink); }
    .mode-card[aria-pressed="true"] { border-color: var(--color-ink); }
    .mode-card b { font-size: 1.05rem; font-weight: 700; }
    .mode-card small { grid-column: 1; font-size: 0.85rem; font-weight: 500; line-height: 1.3; color: var(--color-muted); }
    .mode-card .best { grid-column: 2; grid-row: 1 / span 2; align-self: center; max-width: 7.5rem; font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.3; text-align: right; color: var(--color-muted); }
    .mode-card[aria-pressed="true"] .best { color: var(--color-go); }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 3.25rem; padding: 0.3rem 0; border-bottom: 1px solid var(--color-line); font-size: 1rem; font-weight: 600; }
    .setting-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.4rem; }
    .rules-list { margin-top: 1rem; }
    .rules-list ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .rules-list li { font-size: 0.875rem; line-height: 1.35; font-weight: 500; color: var(--color-muted); }
    .card-head { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .card-title { margin: 0.15rem 0 0; font-size: 1.7rem; line-height: 1.05; font-weight: 700; }
    .card-sub { margin: 0.25rem 0 0.9rem; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .card-sub .tone-go, .card-sub .tone-fault { font-weight: 700; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem; padding-top: 0.75rem; border-top: 1px solid var(--color-line); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .session.cols-4 { grid-template-columns: repeat(4, 1fr); margin-bottom: 0.9rem; }
    .cell.is-avg { border-style: dashed; }
    .empty { margin: 0 0 0.9rem; padding: 0.9rem; border: 1px dashed var(--color-line); border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--color-muted); text-align: center; }
    .install { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0; padding: 0.6rem 0.75rem 0.6rem 1rem; border: 1px solid var(--color-line); border-radius: 0.75rem; background: var(--color-inset); font-size: 0.875rem; font-weight: 500; line-height: 1.3; color: var(--color-muted); }
    .install[hidden] { display: none; }
    .install strong { color: var(--color-ink); font-weight: 700; }
    .install button { flex: none; min-height: 2.75rem; padding: 0 0.85rem; border: 1px solid var(--color-line); border-radius: 0.6rem; background: transparent; color: var(--color-ink); font-size: 0.875rem; }
    .foot { margin: 0; text-align: center; font-size: 0.75rem; letter-spacing: 0.04em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes lamp-in { from { transform: scale(0.86); } to { transform: scale(1); } }
    @keyframes tray {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px) rotate(-0.4deg); }
      40% { transform: translateX(3px) rotate(0.4deg); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(1px); }
    }
    @keyframes wash { from { opacity: 0.9; } to { opacity: 0; } }
    @keyframes pop-in { from { transform: scale(0.94); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
    .gantry.is-shaking { animation: tray 280ms ease-out; }
    .gantry.is-fault::after, .gantry.is-best::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; animation: wash 420ms ease-out forwards;
    }
    .gantry.is-fault::after { background: color-mix(in srgb, var(--color-fault) 30%, transparent); }
    .gantry.is-best::after { background: color-mix(in srgb, var(--color-go) 24%, transparent); }
    .readout-pop { animation: pop-in 140ms ease-out; }

    @media (min-width: 640px) {
      .bulb { width: 2.05rem; height: 2.05rem; }
    }
    @media (min-width: 640px) and (min-height: 521px) {
      .sheet { inset: 50% auto auto 50%; transform: translate(-50%, -50%); max-height: 86vh; border-radius: 1.25rem; border-bottom: 1px solid var(--color-line); }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      .shell { width: min(100%, 64rem); display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); grid-template-rows: repeat(3, auto) 1fr; align-content: start; column-gap: 1.25rem; row-gap: 0.6rem; padding-top: max(0.75rem, env(safe-area-inset-top)); padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
      .shell > header { grid-column: 1; grid-row: 1; }
      .shell > .mode-btn { grid-column: 1; grid-row: 2; }
      .shell > .install { grid-column: 1; grid-row: 3; }
      .shell > .panel { grid-column: 2; grid-row: 1 / -1; align-self: start; }
      .shell > .foot { grid-column: 1; grid-row: 4; align-self: start; text-align: left; }
      .play-surface { padding-top: 0.6rem; }

      function defaultSave() {

      function roundTotal(runs) { return runs.reduce((sum, run) => sum + (run.fault || run.ms == null ? SEASON.jumpMs : run.ms), 0); }

          track, at: Date.now(), pos, points: POINTS[pos - 1],

        let champion = null;
        let title = false;
        if (champ.round >= SEASON.rounds) {

        } catch {
          note("That file is not a Lights Out export.");
        }
      });
      function armReset() {
        resetArmed = true;
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetArmed = false; if (sheet.open) renderSheet(); }, 3000);
        renderSheet();
      }
      function confirmReset() {
        clearTimeout(resetTimer);
        clearTimers();
        const sound = save.sound;
        const shake = save.shake;
        const mode = save.mode;
        const haptics = save.haptics;
        const tipDismissed = save.tipDismissed;
        save = defaultSave();
        save.sound = sound;
        save.shake = shake;
        save.haptics = haptics;
        save.tipDismissed = tipDismissed;
        save.mode = mode;
        session = [];
        last = null;
        flash = null;
        sim.phase = "idle";
        sim.lit = 0;
        resetArmed = false;
        persist();
        note("Records cleared.");
        render();
      }
      window.addEventListener("keydown", (event) => {
        if (event.repeat || sheet.open) return;
        if (event.key === "Escape") { event.preventDefault(); standDown(); return; }
        if (event.key !== " " && event.key !== "Enter") return;
        if (event.target instanceof Element && event.target.closest("[data-control]")) return;
        event.preventDefault();
        press(event.timeStamp, "keyboard");
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          persist();
          standDown();
        } else if (ctx && ctx.state !== "running") ctx.resume().catch(() => {});
      });
      window.addEventListener("pageshow", () => { if (ctx && ctx.state !== "running") ctx.resume().catch(() => {}); });
      document.addEventListener("selectstart", (event) => event.preventDefault());
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      render();
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
      }
    })();
  </script>
</body>
</html>
